{{template "base.html" .}}

{{define "title"}}链接管理 - GoShorty{{end}}

{{define "content"}}
<div class="page-header">
    <h2>链接管理</h2>
    <p>管理所有短链接</p>
</div>

<!-- Search and Filter -->
<div class="card mb-3">
    <form class="flex gap-2 align-center" hx-get="/admin/api/links" hx-target="#links-table" hx-trigger="submit, change from:select">
        <div class="form-group" style="flex: 1; margin-bottom: 0;">
            <input type="text" name="search" placeholder="搜索短码或原始链接..." style="width: 100%;">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <select name="status" style="padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px;">
                <option value="">全部状态</option>
                <option value="active">活跃</option>
                <option value="expired">已过期</option>
                <option value="inactive">已禁用</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">
            搜索
        </button>
    </form>
</div>

<!-- Links Table -->
<div class="card">
    <div id="links-table" hx-get="/admin/api/links" hx-trigger="load" hx-swap="innerHTML">
        <div class="text-center text-muted" style="padding: 2rem;">
            <span class="spinner"></span> 加载中...
        </div>
    </div>
</div>
{{end}}

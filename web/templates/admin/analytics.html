{{template "base.html" .}}

{{define "title"}}统计分析 - GoShorty{{end}}

{{define "content"}}
<div class="page-header">
    <h2>统计分析</h2>
    <p>查看链接访问统计和分析数据</p>
</div>

<!-- 链接选择 -->
<div class="card mb-3">
    <form class="flex gap-2 align-center" hx-get="/admin/api/analytics/link" hx-target="#analytics-content" hx-trigger="submit">
        <div class="form-group" style="flex: 1; margin-bottom: 0;">
            <input type="text" name="link_id" placeholder="输入链接ID查看统计..." style="width: 100%;" required>
        </div>
        <button type="submit" class="btn btn-primary">
            查看统计
        </button>
    </form>
</div>

<!-- 统计内容区域 -->
<div id="analytics-content">
    <div class="card text-center text-muted" style="padding: 3rem;">
        <p>请输入链接ID查看统计数据</p>
    </div>
</div>
{{end}}

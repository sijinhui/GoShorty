<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>短码</th>
                <th>原始链接</th>
                <th>点击数</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {{template "components/link_row.html" .}}
        </tbody>
    </table>
</div>

{{if .pagination}}
<div class="flex justify-between align-center mt-3">
    <div class="text-muted">
        显示 {{.pagination.offset}} - {{.pagination.end}} / 共 {{.pagination.total}} 条
    </div>
    <div class="flex gap-1">
        {{if .pagination.has_prev}}
        <button class="btn btn-secondary btn-small"
                hx-get="/admin/api/links?page={{.pagination.prev_page}}"
                hx-target="#links-table">
            上一页
        </button>
        {{end}}
        {{if .pagination.has_next}}
        <button class="btn btn-secondary btn-small"
                hx-get="/admin/api/links?page={{.pagination.next_page}}"
                hx-target="#links-table">
            下一页
        </button>
        {{end}}
    </div>
</div>
{{end}}
